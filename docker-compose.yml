networks:
  1panel-network:
      external: true

services:
  sessiondeck:
    build: .
    container_name: sessiondeck
    restart: unless-stopped
    ports:
      # Expose for external Traefik (deck.hha.sh via hexapuma)
      - "7890:7890"
    environment:
      - NODE_ENV=production
      - SESSION_DECK_PORT=7890
      - SESSION_DECK_HOST=0.0.0.0
      - SESSION_DECK_LOG_LEVEL=info
      - SESSION_DECK_DB_PATH=/app/data/session-deck.db
      - SESSION_DECK_SESSION_SECRET=${SESSION_DECK_SESSION_SECRET:-}
      - SESSION_DECK_SESSION_MAX_AGE=${SESSION_DECK_SESSION_MAX_AGE:-86400}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      # Persist SQLite database across rebuilds
      - ./data:/app/data
      # Allow Session Deck to list and exec into running Docker containers on the host
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SESSION_DECK_PORT:-7890}/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - 1panel-network
